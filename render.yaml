services:
  - type: web
    name: veritas-research-swarm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn swarm.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_MODE
        value: sample
      - key: MODEL_PROVIDER
        value: mock
      - key: PYTHON_VERSION
        value: "3.12"